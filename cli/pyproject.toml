[project]
name = "beckett"
version = "0.2.1"
description = "Beckett CLI — Pydantic AI loop runtime for Pirandello roles"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.7",
    "pydantic-ai>=0.0.14",
    "pyyaml>=6.0",
    "typer>=0.12.0",
]

[dependency-groups]
dev = ["pytest>=8"]

[project.scripts]
beckett = "beckett.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["beckett"]

[tool.hatch.build.targets.wheel.force-include]
"beckett/_data/.env.example" = "beckett/_data/.env.example"
"beckett/_data/templates/OODA.md" = "beckett/_data/templates/OODA.md"
