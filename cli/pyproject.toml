[project]
name = "beckett"
version = "0.1.0"
description = "Beckett CLI — OODA heartbeat runner, guards, and monitoring"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "typer>=0.12.0",
]

[project.scripts]
beckett = "beckett.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["beckett"]

[tool.hatch.build.targets.wheel.force-include]
"beckett/_data/.env.example" = "beckett/_data/.env.example"
"beckett/_data/templates/OODA.md" = "beckett/_data/templates/OODA.md"
